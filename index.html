<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Resource Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    button { margin: 0 .4rem .4rem 0; padding: .4rem .7rem; cursor: pointer; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, 48px); gap: 4px; margin: 1rem 0; }
    .page { width: 48px; height: 48px; border-radius: 4px; }
    .page.free { background: #e5e7eb; border: 1px dashed #9ca3af; box-sizing: border-box; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    td, th { border-bottom: 1px solid #e5e7eb; padding: .3rem .4rem; text-align: left; font-size: 14px; }
    #msg { color: #b91c1c; min-height: 1.4em; }
    h2 { font-size: 1.05rem; margin: 1.2rem 0 .4rem; }
    .access { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .access input[type=number] { width: 5rem; }
    #log { list-style: none; padding: 0; margin: .5rem 0 1rem; font: 13px ui-monospace, monospace; max-height: 200px; overflow-y: auto; }
    #log li { padding: .2rem .4rem; border-left: 3px solid; margin-bottom: 2px; }
    #log li.ok { border-color: #16a34a; background: #f0fdf4; }
    #log li.blocked { border-color: #dc2626; background: #fef2f2; }
  </style>
</head>
<body>
  <h1>Memory Resource Manager</h1>
  <div id="apps"></div>
  <div id="msg"></div>
  <div id="grid"></div>
  <div id="stats"></div>

  <h2>Resource map</h2>
  <canvas id="chart" width="460" height="200"></canvas>

  <h2>Process isolation</h2>
  <div class="access">
    <label>Actor <select id="actor"></select></label>
    <label>Target page <input id="target" type="number" min="0" value="0"></label>
    <label>Value <input id="value" type="text" value="secret"></label>
    <button data-op="read">Read</button>
    <button data-op="write">Write</button>
  </div>
  <ul id="log"></ul>

  <h2>Processes</h2>
  <table>
    <thead><tr><th>PID</th><th>App</th><th>Size</th><th>Start page</th><th></th></tr></thead>
    <tbody id="procs"></tbody>
  </table>

  <h2>Page lookup table</h2>
  <table>
    <thead><tr><th>Page</th><th>Address</th><th>Status</th><th>Owner</th></tr></thead>
    <tbody id="pages"></tbody>
  </table>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
